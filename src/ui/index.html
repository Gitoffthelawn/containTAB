<!-- Sub Screen: Containers -->

      <h3 id="dialog-title">Confirm</h3>

          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>

        </svg>
      </button>
    </div>
    <div class="dialog-body">
      <p id="dialog-message"></p>
      <input type="text" class="dialog-input hide" autocomplete="off"/>
      <div class="dialog-error" role="alert" aria-live="polite"></div>
    </div>
    <div class="dialog-footer">
      <button class="dialog-cancel-button">Cancel</button>
      <button class="dialog-confirm-button">OK</button>
    </div>
  </div>
</div>
